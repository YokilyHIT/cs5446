# Fixed configuration for the two pre-experiments (Selective Failure Learning / A,
# Prediction Confidence vs Planning Utility / B).
#
# This file is the single source of truth for model/sampling/seed parameters.
# Every script under preexperiments/ must read its defaults from here instead of
# hard-coding literals, so that every result JSON/CSV can cite one config version.

model:
  name: "Qwen/Qwen3-4B-Instruct-2507"
  # vLLM OpenAI-compatible server, started separately on the NPU host
  # (see scripts/start_vllm_npu.sh). This machine only ever talks HTTP to it.
  api_base: "http://127.0.0.1:8001/v1"
  api_key: "EMPTY"          # vLLM does not check this, but the OpenAI SDK requires a value
  request_timeout_s: 120
  max_retries: 5

sampling:
  temperature: 0.2
  top_p: 0.95
  max_tokens_per_action: 256
  max_episode_steps: 30
  # Which action-selection prompt the ReAct agent uses. Whichever is set here
  # applies identically to EVERY condition in both experiments (no-lesson vs
  # with-lesson, base vs foresight), so it can never bias a comparison -- it
  # only sets how capable the shared base planner is.
  #   "spec"          - the fixed prompt from spec section 5.1, decoded under a
  #                     guided_choice constraint over the admissible actions.
  #   "adamem_think"  - AdaMEM's own no-memory ALFWorld prompt (<think> then
  #                     <action>), the remedy spec section 39 names for a
  #                     too-low success rate. Costs more tokens per step and
  #                     cannot use guided_choice (the completion is not a bare
  #                     action string), so watch the forced-action rate via
  #                     scripts/check_forced_action_rate.py.
  #
  # Default stays "spec", even though the spec section 39 decision process
  # actually run on real Ascend hardware (see diagnostics/README.md) measured
  # "adamem_think" performing meaningfully better: "spec" got only 10.0%
  # success (23% of episodes stuck looping among ~12 actions) at
  # max_episode_steps=30, raising max_episode_steps to 50 bought +1 success
  # for 62% more compute (ruled out as the bottleneck -- successful episodes
  # only ever needed 5-12 steps), and "adamem_think" measured 26.7% success
  # with only 10% looping under the same seed/task subset.
  #
  # Reconciled after review (an earlier version of this file defaulted to
  # "adamem_think" based on that same data): switching prompt_style changes
  # what population the results generalize to -- delta is then "value of a
  # lesson to a reasoning agent", not "to the spec section 5.1 agent" -- and
  # that scope change should be a deliberate, visible choice made per run
  # (and stated in the report), not a silent default. Set this explicitly to
  # "adamem_think" (or pass --prompt_style if a script exposes it) when the
  # baseline measured in diagnostics/ justifies it, and say so in the report.
  prompt_style: "spec"
  # Token budget for "adamem_think" only: the reasoning and the action share
  # one completion, and at max_tokens_per_action=256 the model gets cut off
  # mid-<think> and never emits an <action> tag.
  adamem_max_tokens: 512

seeds: [13, 37, 73]

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  # Small model; CPU is sufficient and keeps the NPU free for the LLM server.
  # Set to "npu" to run on Ascend via torch_npu if the host has spare capacity.
  device: "cpu"

splits:
  experience: "train"
  evaluation: "eval_in_distribution"
  # eval_out_of_distribution intentionally unused in phase 1 (see spec section 3)

paths:
  adamem_root: "../AdaMEM"        # relative to this repo root, set by setup script
  results_dir: "results"
  figures_dir: "figures"
  reports_dir: "reports"

experiment_a:
  max_train_episodes: 50
  min_failures: 20
  lesson_temperature: 0.2
  related_tasks_k: 3
  max_failures_evaluated: 20
  eval_subset_size: 30
  topk_fraction: 0.4

experiment_b:
  eval_episodes: 30
  decision_points_per_episode: 5
  target_decision_points: 150
  calibration_points: 50
  evaluation_points: 100
  confidence_gate_target_usage: 0.5
  action_ambiguity_samples: 4
  # Steps each counterfactual branch gets, counted FROM the decision point --
  # not the remainder of the global episode cap. Decision points are spread
  # across the whole episode, so a point at step 29 would otherwise leave both
  # branches one step each: both fail, Delta_t = 0, and that 0 reflects the
  # budget rather than the foresight. Both branches always get the same
  # number, so the paired comparison stays valid. Falls back to
  # sampling.max_episode_steps if unset.
  branch_rollout_budget: 30

stats:
  bootstrap_resamples: 1000
  bootstrap_seed: 2026
